#cloud-config

# Ubuntu desktop with a loopback-only TigerVNC server for PassGo Web.
# PassGo tunnels raw RFB traffic through `multipass exec`; no guest web server
# or VNC port is exposed on the VM network.

package_update: true

packages:
  - xfce4
  - xfce4-goodies
  - dbus-x11
  - tigervnc-standalone-server
  - netcat-openbsd
  - openssl

write_files:
  - path: /home/ubuntu/.config/tigervnc/xstartup
    owner: ubuntu:ubuntu
    permissions: '0755'
    content: |
      #!/bin/sh
      unset SESSION_MANAGER
      unset DBUS_SESSION_BUS_ADDRESS
      exec startxfce4

  - path: /etc/systemd/system/passgo-vnc.service
    permissions: '0644'
    content: |
      [Unit]
      Description=PassGo VNC desktop for ubuntu user
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=forking
      User=ubuntu
      Group=ubuntu
      WorkingDirectory=/home/ubuntu
      Environment=HOME=/home/ubuntu
      ExecStart=/usr/bin/vncserver :1 -localhost yes -geometry 1280x800 -depth 24
      ExecStop=/usr/bin/vncserver -kill :1
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [ install, -d, -o, ubuntu, -g, ubuntu, -m, '0700', /home/ubuntu/.config/tigervnc ]
  - [ bash, -lc, 'password="$(openssl rand -base64 6)"; printf "%s\n" "$password" | vncpasswd -f > /home/ubuntu/.config/tigervnc/passwd; printf "%s\n" "$password" > /home/ubuntu/.config/tigervnc/passgo-password' ]
  - [ chown, ubuntu:ubuntu, /home/ubuntu/.config/tigervnc/passwd, /home/ubuntu/.config/tigervnc/passgo-password ]
  - [ chmod, '0600', /home/ubuntu/.config/tigervnc/passwd, /home/ubuntu/.config/tigervnc/passgo-password ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, passgo-vnc.service ]

final_message: "PassGo desktop ready after $UPTIME seconds"
